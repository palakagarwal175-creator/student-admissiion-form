<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
</head>
<h1><center>Student Admission Form</center></h1>
<body>
    <table cellpadding="5" colspan="2" cellspacong="5" bgcolor="aqua" align="center">
        <tr>
            <td>Student Name:</td>
            <td>
                <input type="text" placeholder="Enter Student's name" size="">
            </td>
        </tr>
        <tr>
            <td>Father's name:</td>
            <td> 
                <input type="text" placeholder="Enter Father's name" size="">
            </td>
        </tr>
        <tr>
            <td>Mother's name:</td>
            <td>
                <input type="text" placeholder="Enter Mother's name" size="">
            </td>
        </tr>
        <tr>
            <td>Date of Birth:</td>
            <td>
                <input type="Date" placeholder="Date" size="">
            </td>
        </tr>
        <tr>
            <td>Email:</td>
            <td>
                <input type="text" placeholder="Enter Email" size="">
            </td>
        </tr>
        <tr>
            <td>Contact:</td>
            <td>
                <input type="text" placeholder="Enter Contact number" size="">
            </td>
        </tr>
        <tr>
            <td>Gender:</td>
            <td>
                <input type="radio" placeholder="Gender" size="">Male
                <input type="radio" placeholder="Gender" size="">Female
            </td>
        </tr>
        <tr>
            <td>Choose Course:</td>
            <td>
                <select name="Course">
                    <option name=" ">---Select Course---</option>
                    <option name=" ">Tally</option>
                    <option name=" ">Web Development</option>
                    <option name=" ">Java</option>
                    <option name=" ">Python</option>
                    <option name=" ">Digital Marketing</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Hobbies:</td>
            <td>
                <input type="checkbox" name="Singing" size="">Singing
                <input type="checkbox" name="Reading" size="">Reading
                <input type="checkbox" name="Dancing" size="">Dancing
            </td>
        </tr>
        <tr>
            <td>Address:</td>
            <td>
                <textarea name="Address"></textarea>
            </td>
        </tr>
        <tr>
            <td>Photo:</td>
            <td>
                <input type="File" placeholder="Photo" size="">
            </td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="Submit" value="Submit" size="">
            </td>
        </tr>
    </table>
</body>
</html>
